name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for security vulnerabilities
        run: |
          pip-audit -r requirements.txt

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Fetch base branch for pull request comparison
        if: github.base_ref != ''
        run: |
          git fetch origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || true

      - name: Install system dependencies for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run static code linting and formatting check
        run: |
          python -c "
          import os, subprocess, sys

          base = os.environ.get('BASE_REF')
          before = os.environ.get('BEFORE_SHA')
          files = []
          diff_ok = False
          refs_to_try = []
          if base:
              try:
                  subprocess.run(['git', 'fetch', 'origin', f'+refs/heads/{base}:refs/remotes/origin/{base}'], capture_output=True)
              except Exception:
                  pass
              refs_to_try.extend([f'origin/{base}', base])
          if before and set(before) != {'0'}:
              refs_to_try.append(before)
          refs_to_try.extend(['HEAD^1', 'HEAD~1'])

          for ref in refs_to_try:
              try:
                  proc = subprocess.run(
                      ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}...HEAD', '--', '*.py'],
                      capture_output=True, text=True, check=True
                  )
                  files = [f.strip() for f in proc.stdout.splitlines() if f.strip() and os.path.exists(f.strip())]
                  diff_ok = True
                  break
              except Exception:
                  continue

          if diff_ok and not files:
              print('No Python files modified; skipping ruff checks.')
          else:
              targets = files if files else ['.']
              print(f'Checking {len(targets)} target(s) with ruff: {targets}')
              subprocess.run(['ruff', 'check'] + targets, check=True)
              subprocess.run(['ruff', 'format', '--check'] + targets, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}

      - name: Build plugin packages in strict mode
        run: |
          python build.py
          python build_plugins.py --strict

      - name: Verify generated plugin zip artifacts
        run: |
          python scripts/verify_plugins.py

      - name: Upload plugin packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.zip
          retention-days: 14
          overwrite: true

      - name: Run unit test suite
        run: |
          python -c "
          from pathlib import Path
          import glob, os, subprocess, sys

          base = os.environ.get('BASE_REF')
          before = os.environ.get('BEFORE_SHA')
          test_targets = []
          diff_ok = False
          refs_to_try = []
          if base:
              try:
                  subprocess.run(['git', 'fetch', 'origin', f'+refs/heads/{base}:refs/remotes/origin/{base}'], capture_output=True)
              except Exception:
                  pass
              refs_to_try.extend([f'origin/{base}', base])
          if before and set(before) != {'0'}:
              refs_to_try.append(before)
          refs_to_try.extend(['HEAD^1', 'HEAD~1'])

          for ref in refs_to_try:
              try:
                  proc = subprocess.run(
                      ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}...HEAD', '--', '*.py'],
                      capture_output=True, text=True, check=True
                  )
                  changed = [f.strip() for f in proc.stdout.splitlines() if f.strip()]
                  for c in changed:
                      norm_c = Path(c).as_posix()
                      if norm_c.startswith('tests/test_') and norm_c.endswith('.py') and os.path.exists(c):
                          test_targets.append(c)
                      else:
                          part = norm_c.split('/')[0]
                          stem = Path(c).stem
                          for match in glob.glob(f'tests/test_{part}*.py'):
                              test_targets.append(match)
                          for match in glob.glob(f'tests/test_{stem}*.py'):
                              test_targets.append(match)
                  diff_ok = True
                  break
              except Exception:
                  continue
          test_targets = sorted(list(set(test_targets)))

          if diff_ok and not test_targets:
              print('No Python code or test targets modified; skipping test suite.')
          else:
              targets = test_targets if test_targets else ['tests/']
              print(f'Running unit tests on targets: {targets}')
              cmd = [sys.executable, '-m', 'pytest'] + targets
              subprocess.run(cmd, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}

