name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for security vulnerabilities
        run: |
          pip-audit -r requirements.txt

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run static code linting and formatting check
        run: |
          python -c "
          import os, subprocess, sys

          base = os.environ.get('BASE_REF')
          files = []
          if base:
              for ref in [f'origin/{base}', base]:
                  try:
                      proc = subprocess.run(
                          ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}...HEAD', '--', '*.py'],
                          capture_output=True, text=True, check=True
                      )
                      files = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip() and os.path.exists(f.strip().replace(chr(92), '/'))]
                      if files:
                          break
                  except Exception:
                      continue

          targets = files if files else ['.']
          print(f'Checking {len(targets)} target(s) with ruff: {targets}')
          subprocess.run(['ruff', 'check'] + targets, check=True)
          subprocess.run(['ruff', 'format', '--check'] + targets, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Build plugin packages in strict mode
        run: |
          python build.py
          python build_plugins.py --strict

      - name: Verify generated plugin zip artifacts
        run: |
          python scripts/verify_plugins.py

      - name: Upload plugin packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.zip
          retention-days: 14
          overwrite: true

      - name: Run unit test suite
        run: |
          python -c "
          import glob, os, subprocess, sys

          base = os.environ.get('BASE_REF')
          test_targets = []
          if base:
              for ref in [f'origin/{base}', base]:
                  try:
                      proc = subprocess.run(
                          ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}...HEAD', '--', '*.py'],
                          capture_output=True, text=True, check=True
                      )
                      changed = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip()]
                      for c in changed:
                          if c.startswith('tests/test_') and c.endswith('.py') and os.path.exists(c):
                              test_targets.append(c)
                          else:
                              part = c.split('/')[0]
                              prefixes = [part]
                              if part == 'plugin':
                                  prefixes.extend(['takeout', 'plugin'])
                              elif part == 'scrubber_plugin':
                                  prefixes.extend(['scrubber', 'epub_merge'])
                              for p in prefixes:
                                  for match in glob.glob(f'tests/test_{p}*.py'):
                                      test_targets.append(match.replace(chr(92), '/'))
                      if test_targets:
                          break
                  except Exception:
                      continue
              test_targets = sorted(list(set(test_targets)))

          targets = test_targets if test_targets else ['tests/']
          print(f'Running unit tests on targets: {targets}')
          cmd = [sys.executable, '-m', 'pytest'] + targets
          subprocess.run(cmd, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

