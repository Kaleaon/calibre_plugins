name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for security vulnerabilities
        run: |
          pip-audit -r requirements.txt

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static code linting and formatting check
        run: |
          ruff check .
          ruff format --check .

      - name: Build plugin packages in strict mode
        run: |
          python build.py
          python build_plugins.py --strict

      - name: Verify generated plugin zip artifacts
        run: |
          python -c "
          import os, sys
          expected_zips = [
              'TakeoutBookFixer.zip',
              'EpubPromoScrubber.zip',
              'MetabodsDownloader.zip',
              'NiftyDownloader.zip',
              'StoryCollectionTagger.zip',
              'FanficDownloader.zip',
              'RedditStoryFollower.zip',
              'GeminiLibraryFixer.zip',
              'MediaMatcher.zip'
          ]
          dist_dir = 'dist'
          missing = [z for z in expected_zips if not os.path.exists(os.path.join(dist_dir, z))]
          if missing:
              print(f'Error: Missing expected zip files in dist/: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'Successfully verified all {len(expected_zips)} plugin archives in dist/.')
          "

      - name: Upload plugin packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin-packages
          path: dist/*.zip
          retention-days: 14

      - name: Run unit test suite
        run: |
          python -m pytest tests/

