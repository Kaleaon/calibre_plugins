name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for security vulnerabilities
        run: |
          pip-audit -r requirements.txt

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    permissions:
      contents: read

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Fetch base branch for pull request comparison
        if: github.base_ref != ''
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || true

      - name: Install system dependencies for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run static code linting and formatting check
        run: |
          python -c "
          import os, subprocess, sys

          base = os.environ.get('BASE_REF')
          files = []
          diff_ok = False
          if base:
              subprocess.run(['git', 'fetch', 'origin', f'{base}:refs/remotes/origin/{base}'], capture_output=True)
              subprocess.run(['git', 'fetch', 'origin', base], capture_output=True)
              for ref in [f'origin/{base}', base, 'FETCH_HEAD', 'HEAD^1']:
                  for sep in ['...', '..']:
                      try:
                          proc = subprocess.run(
                              ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}{sep}HEAD', '--', '*.py'],
                              capture_output=True, text=True, check=True
                          )
                          files = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip() and os.path.exists(f.strip().replace(chr(92), '/'))]
                          if files:
                              diff_ok = True
                              break
                      except Exception:
                          continue
                  if diff_ok:
                      break

          if base:
              targets = files
              if not targets:
                  print(f'No Python files modified in this pull request relative to base branch {base}; skipping ruff checks.')
                  sys.exit(0)
          else:
              targets = files if files else ['.']

          print(f'Checking {len(targets)} target(s) with ruff: {targets}')
          subprocess.run(['ruff', 'check', '--force-exclude'] + targets, check=True)
          subprocess.run(['ruff', 'format', '--check', '--force-exclude'] + targets, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Build plugin packages in strict mode
        run: |
          python build.py
          python build_plugins.py --strict

      - name: Verify generated plugin zip artifacts
        run: |
          python scripts/verify_plugins.py

      - name: Upload plugin packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.zip
          retention-days: 14
          overwrite: true

      - name: Run unit test suite
        run: |
          python -c "
          import glob, os, subprocess, sys

          base = os.environ.get('BASE_REF')
          test_targets = []
          diff_ok = False
          if base:
              subprocess.run(['git', 'fetch', 'origin', f'{base}:refs/remotes/origin/{base}'], capture_output=True)
              subprocess.run(['git', 'fetch', 'origin', base], capture_output=True)
              for ref in [f'origin/{base}', base, 'FETCH_HEAD', 'HEAD^1']:
                  for sep in ['...', '..']:
                      try:
                          proc = subprocess.run(
                              ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}{sep}HEAD', '--', '*.py'],
                              capture_output=True, text=True, check=True
                          )
                          changed = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip()]
                          module_test_map = {
                              'common': ['tests/test_guikit*.py'],
                              'fanfic': ['tests/test_fanfic*.py', 'tests/test_flaresolverr*.py'],
                              'furry': ['tests/test_furry*.py'],
                              'gemini': ['tests/test_gemini*.py'],
                              'media': ['tests/test_media*.py'],
                              'metabods': ['tests/test_metabods*.py'],
                              'nifty': ['tests/test_nifty*.py'],
                              'reddit': ['tests/test_reddit*.py'],
                              'scrubber': ['tests/test_scrubber.py'],
                              'scrubber_plugin': ['tests/test_scrubber.py', 'tests/test_qt_dialogs.py::ScrubberPluginTests'],
                              'tagger': ['tests/test_tagger*.py'],
                              'takeout': ['tests/test_takeout*.py'],
                              'takeout_plugin': ['tests/test_takeout*.py'],
                          }
                          for c in changed:
                              norm_c = c.replace(chr(92), '/')
                              if norm_c == 'tests/test_qt_dialogs.py':
                                  test_targets.append('tests/test_qt_dialogs.py::ScrubberPluginTests')
                              elif norm_c.startswith('tests/test_') and norm_c.endswith('.py') and os.path.exists(norm_c):
                                  test_targets.append(norm_c)
                              else:
                                  part = norm_c.split('/')[0].lower()
                                  if part in module_test_map:
                                      for pattern in module_test_map[part]:
                                          if '::' in pattern:
                                              test_targets.append(pattern)
                                          else:
                                              for match in glob.glob(pattern):
                                                  test_targets.append(match.replace(chr(92), '/'))
                                  else:
                                      for match in glob.glob(f'tests/test_{part}*.py'):
                                          test_targets.append(match.replace(chr(92), '/'))
                          if changed:
                              diff_ok = True
                              break
                      except Exception:
                          continue
                  if diff_ok:
                      break
              test_targets = sorted(list(set(test_targets)))

          if base:
              targets = test_targets
              if not targets:
                  print(f'No unit test suites affected by PR changes relative to base branch {base}; skipping tests.')
                  sys.exit(0)
          else:
              targets = test_targets if test_targets else ['tests/']

          print(f'Running unit tests on targets: {targets}')
          cmd = [sys.executable, '-m', 'pytest'] + targets
          subprocess.run(cmd, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

