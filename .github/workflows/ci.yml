name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for security vulnerabilities
        run: |
          pip-audit -r requirements.txt

  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static code linting and formatting check
        run: |
          python -c "
          import os, subprocess, sys

          base = os.environ.get('BASE_REF')
          files = []
          if base:
              subprocess.run(['git', 'fetch', 'origin', f'{base}:refs/remotes/origin/{base}'], capture_output=True)
              subprocess.run(['git', 'fetch', 'origin', base], capture_output=True)
              for ref in [f'origin/{base}', base, 'FETCH_HEAD']:
                  for sep in ['...', '..']:
                      try:
                          proc = subprocess.run(
                              ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}{sep}HEAD', '--', '*.py'],
                              capture_output=True, text=True, check=True
                          )
                          files = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip() and os.path.exists(f.strip().replace(chr(92), '/'))]
                          if files:
                              break
                      except Exception:
                          continue
                  if files:
                      break

          if base:
              targets = files
              if not targets:
                  print(f'No Python files changed relative to base branch {base}. Skipping ruff checks.')
                  sys.exit(0)
          else:
              targets = files if files else ['.']

          print(f'Checking {len(targets)} target(s) with ruff: {targets}')
          env = dict(os.environ)
          env.setdefault('PYTHONPATH', '.')
          subprocess.run(['ruff', 'check'] + targets, env=env, check=True)
          subprocess.run(['ruff', 'format', '--check'] + targets, env=env, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Build plugin packages in strict mode
        run: |
          python build.py
          python build_plugins.py --strict

      - name: Verify generated plugin zip artifacts
        run: |
          python -c "
          import os, sys
          expected_zips = [
              'TakeoutBookFixer.zip',
              'EpubPromoScrubber.zip',
              'MetabodsDownloader.zip',
              'NiftyDownloader.zip',
              'StoryCollectionTagger.zip',
              'FanficDownloader.zip',
              'RedditStoryFollower.zip',
              'GeminiLibraryFixer.zip',
              'MediaMatcher.zip'
          ]
          dist_dir = 'dist'
          missing = [z for z in expected_zips if not os.path.exists(os.path.join(dist_dir, z))]
          if missing:
              print(f'Error: Missing expected zip files in dist/: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'Successfully verified all {len(expected_zips)} plugin archives in dist/.')
          "

      - name: Upload plugin packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin-packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.zip
          retention-days: 14
          overwrite: true

      - name: Run unit test suite
        run: |
          python -c "
          import glob, os, subprocess, sys

          base = os.environ.get('BASE_REF')
          test_targets = []
          if base:
              subprocess.run(['git', 'fetch', 'origin', f'{base}:refs/remotes/origin/{base}'], capture_output=True)
              subprocess.run(['git', 'fetch', 'origin', base], capture_output=True)
              for ref in [f'origin/{base}', base, 'FETCH_HEAD']:
                  for sep in ['...', '..']:
                      try:
                          proc = subprocess.run(
                              ['git', 'diff', '--name-only', '--diff-filter=d', f'{ref}{sep}HEAD', '--', '*.py'],
                              capture_output=True, text=True, check=True
                          )
                          changed = [f.strip().replace(chr(92), '/') for f in proc.stdout.splitlines() if f.strip()]
                          for c in changed:
                              c = c.replace(chr(92), '/')
                              if c.startswith('tests/test_') and c.endswith('.py') and os.path.exists(c):
                                  test_targets.append(c)
                              else:
                                  part = c.split('/')[0]
                                  for match in glob.glob(f'tests/test_{part}*.py'):
                                      test_targets.append(match.replace(chr(92), '/'))
                          if test_targets:
                              break
                      except Exception:
                          continue
                  if test_targets:
                      break
              test_targets = sorted(list(set(test_targets)))

          if base:
              targets = test_targets
              if not targets:
                  print(f'No test suites affected by PR changes relative to base branch {base}. Skipping tests.')
                  sys.exit(0)
          else:
              targets = test_targets if test_targets else ['tests/']

          print(f'Running unit tests on targets: {targets}')
          env = dict(os.environ)
          env.setdefault('QT_QPA_PLATFORM', 'offscreen')
          env.setdefault('PYTHONPATH', '.')
          cmd = [sys.executable, '-m', 'pytest'] + targets
          subprocess.run(cmd, env=env, check=True)
          "
        env:
          BASE_REF: ${{ github.base_ref }}

