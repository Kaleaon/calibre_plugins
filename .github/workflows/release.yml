name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'calibre_link/sidecar/go.mod'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fanficfare PyQt6 lxml cloudscraper requests-file requests-toolbelt pyparsing

      - name: Run unit tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build plugin packages
        run: |
          python build_plugins.py --strict

      - name: Build Calibre Link sidecar and package
        run: |
          sh calibre_link/sidecar/build.sh
          python calibre_link/build_zip.py
          mv calibre_link/CalibreLink.zip dist/

      - name: Generate SHA256SUMS manifest
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cp SHA256SUMS SHA256SUMS.txt

      - name: Generate SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt
          generate_release_notes: true
