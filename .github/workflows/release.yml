name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run unit tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build plugin packages
        run: |
          python build_plugins.py --strict

      - name: Generate SHA256SUMS manifest
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cp SHA256SUMS SHA256SUMS.txt

      - name: Upload plugin packages and manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Generate SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Check out main to refresh the dist downloads
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-dist

      - name: Commit the packaged zips to dist/ on main
        run: |
          cp dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.txt main-dist/dist/
          cd main-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist/ on main is already up to date"
          else
            git commit -m "dist: refresh plugin zips for ${{ github.ref_name }}"
            git push origin main
          fi
