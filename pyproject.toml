[tool.ruff]
target-version = "py310"
line-length = 120
include = [
    "common/guikit.py",
    "fanfic/ui.py",
    "nifty/core.py",
    "plugin/action.py",
    "plugin/importer.py",
    "plugin/queue_db.py",
    "tests/test_importer.py",
    "tests/test_nifty_authors.py",
    "tests/test_qt_dialogs.py",
]
extend-exclude = [
    "dist",
    "build",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = ["E501", "E741", "UP031"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "fanfic",
    "gemini",
    "media",
    "metabods",
    "nifty",
    "plugin",
    "reddit",
    "scrubber_plugin",
    "tagger",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
