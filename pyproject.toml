[tool.ruff]
target-version = "py310"
line-length = 120

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line-too-long handled by ruff format
    "UP038", # isinstance tuple-union syntax deprecation
]
