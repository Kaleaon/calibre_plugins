[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "dist",
    "build",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "fanfic",
    "gemini",
    "media",
    "metabods",
    "nifty",
    "plugin",
    "reddit",
    "scrubber_plugin",
    "tagger",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --ignore=tests/test_qt_dialogs.py --ignore=tests/test_empty_state_overlay.py --ignore=tests/test_reddit_registry.py --ignore=tests/test_readme_index.py --ignore=tests/test_scrubber.py"
