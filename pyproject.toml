[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "dist",
    "build",
    "third_party",
    "calibre_link",
    "common",
    "fanfic",
    "gemini",
    "media",
    "metabods",
    "nifty",
    "plugin",
    "reddit",
    "scrubber_plugin",
    "scripts",
    "build.py",
    "build_plugins.py",
    "tagger/__init__.py",
    "tagger/config.py",
    "tagger/fff_sites.py",
    "tagger/presets.py",
    "tagger/rules.py",
    "tagger/ui.py",
    "tests/harness_utils.py",
    "tests/test_tagger_presets.py",
    "tests/calibre_integration.py",
    "tests/reddit_samples.py",
    "tests/takeout_pdf_validation.py",
    "tests/takeout_validation.py",
    "tests/test_core.py",
    "tests/test_empty_state_overlay.py",
    "tests/test_epub_merge.py",
    "tests/test_epub_merge_dialog.py",
    "tests/test_error_handler.py",
    "tests/test_fanfic.py",
    "tests/test_flaresolverr.py",
    "tests/test_flaresolverr_autospawn.py",
    "tests/test_flaresolverr_launcher.py",
    "tests/test_gemini.py",
    "tests/test_guikit.py",
    "tests/test_importer.py",
    "tests/test_media.py",
    "tests/test_media_dialogs.py",
    "tests/test_metabods.py",
    "tests/test_nifty.py",
    "tests/test_nifty_authors.py",
    "tests/test_nifty_posting_order.py",
    "tests/test_plugin_imports.py",
    "tests/test_qt_dialogs.py",
    "tests/test_readme_index.py",
    "tests/test_reddit.py",
    "tests/test_reddit_login.py",
    "tests/test_reddit_opml.py",
    "tests/test_reddit_registry.py",
    "tests/test_reddit_settings.py",
    "tests/test_scrubber.py",
    "tests/test_scrubber_preview.py",
    "tests/test_scrubber_profiles.py",
    "tests/test_storykit_cover.py",
    "tests/test_takeout_duplicates.py",
    "tests/test_takeout_queue.py",
    "tests/test_task_queue.py",
    "tests/test_watch_folder.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = ["E501", "UP017"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "fanfic",
    "gemini",
    "media",
    "metabods",
    "nifty",
    "plugin",
    "reddit",
    "scrubber_plugin",
    "tagger",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-k 'test_tagger or test_rule_set_manager_dialog'"

